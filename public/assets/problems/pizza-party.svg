<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFFEF7"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="24" fill="#2D3748">
    Pizza Night Mystery! 🍕
  </text>
  
  <!-- Pizza Container -->
  <g transform="translate(150, 100)">
    <!-- Pizza Base -->
    <circle cx="150" cy="150" r="140" fill="#F59E0B" stroke="#D97706" stroke-width="3"/>
    
    <!-- Crust -->
    <circle cx="150" cy="150" r="140" fill="none" stroke="#A0522D" stroke-width="8"/>
    
    <!-- Pizza slices (8 total, 3 missing) -->
    <g>
      <!-- Slice lines -->
      <line x1="150" y1="150" x2="150" y2="10" stroke="#8B4513" stroke-width="2"/>
      <line x1="150" y1="150" x2="249" y2="51" stroke="#8B4513" stroke-width="2"/>
      <line x1="150" y1="150" x2="290" y2="150" stroke="#8B4513" stroke-width="2"/>
      <line x1="150" y1="150" x2="249" y2="249" stroke="#8B4513" stroke-width="2"/>
      <line x1="150" y1="150" x2="150" y2="290" stroke="#8B4513" stroke-width="2"/>
      <line x1="150" y1="150" x2="51" y2="249" stroke="#8B4513" stroke-width="2"/>
      <line x1="150" y1="150" x2="10" y2="150" stroke="#8B4513" stroke-width="2"/>
      <line x1="150" y1="150" x2="51" y2="51" stroke="#8B4513" stroke-width="2"/>
      
      <!-- Missing slices (white fill to show they're gone) -->
      <path d="M 150 150 L 150 10 A 140 140 0 0 1 249 51 Z" fill="#FFFEF7" stroke="#D97706" stroke-width="2" stroke-dasharray="5,5"/>
      <path d="M 150 150 L 249 51 A 140 140 0 0 1 290 150 Z" fill="#FFFEF7" stroke="#D97706" stroke-width="2" stroke-dasharray="5,5"/>
      <path d="M 150 150 L 51 249 A 140 140 0 0 1 10 150 Z" fill="#FFFEF7" stroke="#D97706" stroke-width="2" stroke-dasharray="5,5"/>
      
      <!-- Toppings on remaining slices -->
      <!-- Pepperoni -->
      <circle cx="120" cy="180" r="12" fill="#DC2626"/>
      <circle cx="180" cy="120" r="12" fill="#DC2626"/>
      <circle cx="200" cy="200" r="12" fill="#DC2626"/>
      <circle cx="100" cy="100" r="12" fill="#DC2626"/>
      <circle cx="150" cy="220" r="12" fill="#DC2626"/>
      
      <!-- Mushrooms -->
      <ellipse cx="130" cy="130" rx="8" ry="6" fill="#8B7355" transform="rotate(45 130 130)"/>
      <ellipse cx="170" cy="170" rx="8" ry="6" fill="#8B7355" transform="rotate(-30 170 170)"/>
      <ellipse cx="110" cy="150" rx="8" ry="6" fill="#8B7355" transform="rotate(60 110 150)"/>
    </g>
  </g>
  
  <!-- Mystery text -->
  <text x="300" y="370" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="18" fill="#6B4423">
    Hmm... some slices are missing! 🤔
  </text>
</svg>