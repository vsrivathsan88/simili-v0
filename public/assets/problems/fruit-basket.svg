<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF8DC"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="24" fill="#2D3748">
    Fruit Basket Mix-Up! 🧺
  </text>
  
  <!-- Table/Counter -->
  <rect x="0" y="320" width="600" height="80" fill="#8B4513" stroke="#654321" stroke-width="3"/>
  <rect x="0" y="320" width="600" height="10" fill="#A0522D"/>
  
  <!-- Basket -->
  <g transform="translate(200, 200)">
    <!-- Basket base -->
    <path d="M 50 100 Q 50 130 100 130 Q 150 130 150 100 L 150 60 Q 150 40 100 40 Q 50 40 50 60 Z" 
          fill="#D2691E" stroke="#8B4513" stroke-width="3"/>
    <!-- Basket weave pattern -->
    <line x1="60" y1="50" x2="60" y2="120" stroke="#A0522D" stroke-width="2"/>
    <line x1="80" y1="50" x2="80" y2="120" stroke="#A0522D" stroke-width="2"/>
    <line x1="100" y1="50" x2="100" y2="120" stroke="#A0522D" stroke-width="2"/>
    <line x1="120" y1="50" x2="120" y2="120" stroke="#A0522D" stroke-width="2"/>
    <line x1="140" y1="50" x2="140" y2="120" stroke="#A0522D" stroke-width="2"/>
    <!-- Horizontal weaves -->
    <line x1="50" y1="70" x2="150" y2="70" stroke="#A0522D" stroke-width="2"/>
    <line x1="50" y1="90" x2="150" y2="90" stroke="#A0522D" stroke-width="2"/>
    <line x1="50" y1="110" x2="150" y2="110" stroke="#A0522D" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 60 40 Q 100 10 140 40" fill="none" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Fruits in basket -->
  <g transform="translate(200, 180)">
    <!-- Apples (4) -->
    <circle cx="70" cy="50" r="20" fill="#FF0000" stroke="#8B0000" stroke-width="2"/>
    <path d="M 70 30 Q 72 25 70 20" fill="none" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="72" cy="20" rx="4" ry="2" fill="#228B22"/>
    
    <circle cx="100" cy="45" r="20" fill="#FF0000" stroke="#8B0000" stroke-width="2"/>
    <path d="M 100 25 Q 102 20 100 15" fill="none" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="102" cy="15" rx="4" ry="2" fill="#228B22"/>
    
    <circle cx="130" cy="50" r="20" fill="#FF0000" stroke="#8B0000" stroke-width="2"/>
    <path d="M 130 30 Q 132 25 130 20" fill="none" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="132" cy="20" rx="4" ry="2" fill="#228B22"/>
    
    <circle cx="85" cy="75" r="20" fill="#FF0000" stroke="#8B0000" stroke-width="2"/>
    <path d="M 85 55 Q 87 50 85 45" fill="none" stroke="#228B22" stroke-width="2"/>
    <ellipse cx="87" cy="45" rx="4" ry="2" fill="#228B22"/>
    
    <!-- Bananas (3) -->
    <g transform="translate(60, 30)">
      <path d="M 0 0 Q -10 20 -5 40 Q 0 45 5 40 Q 10 20 0 0" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
      <circle cx="0" cy="0" r="2" fill="#8B4513"/>
    </g>
    
    <g transform="translate(90, 25)">
      <path d="M 0 0 Q -10 20 -5 40 Q 0 45 5 40 Q 10 20 0 0" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
      <circle cx="0" cy="0" r="2" fill="#8B4513"/>
    </g>
    
    <g transform="translate(120, 30)">
      <path d="M 0 0 Q -10 20 -5 40 Q 0 45 5 40 Q 10 20 0 0" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
      <circle cx="0" cy="0" r="2" fill="#8B4513"/>
    </g>
    
    <!-- Oranges (3) -->
    <circle cx="115" cy="75" r="18" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
    <circle cx="115" cy="75" r="2" fill="#FF8C00"/>
    
    <circle cx="55" cy="80" r="18" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
    <circle cx="55" cy="80" r="2" fill="#FF8C00"/>
    
    <circle cx="145" cy="80" r="18" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
    <circle cx="145" cy="80" r="2" fill="#FF8C00"/>
  </g>
  
  <!-- Decorative elements -->
  <!-- Kitchen window -->
  <rect x="50" y="50" width="100" height="100" fill="#87CEEB" stroke="#4682B4" stroke-width="3"/>
  <line x1="100" y1="50" x2="100" y2="150" stroke="#4682B4" stroke-width="2"/>
  <line x1="50" y1="100" x2="150" y2="100" stroke="#4682B4" stroke-width="2"/>
  <!-- Curtains -->
  <path d="M 50 50 Q 70 70 50 90" fill="#FFB6C1" stroke="#FF69B4" stroke-width="2"/>
  <path d="M 150 50 Q 130 70 150 90" fill="#FFB6C1" stroke="#FF69B4" stroke-width="2"/>
  
  <!-- Note/Shopping list -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="100" height="120" fill="#FFFACD" stroke="#FFD700" stroke-width="2" transform="rotate(5 50 60)"/>
    <text x="50" y="30" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="#4B0082" transform="rotate(5 50 60)">
      Shopping List:
    </text>
    <text x="20" y="50" font-family="Comic Sans MS, cursive" font-size="12" fill="#4B0082" transform="rotate(5 50 60)">
      ✓ Apples
    </text>
    <text x="20" y="70" font-family="Comic Sans MS, cursive" font-size="12" fill="#4B0082" transform="rotate(5 50 60)">
      ✓ Bananas
    </text>
    <text x="20" y="90" font-family="Comic Sans MS, cursive" font-size="12" fill="#4B0082" transform="rotate(5 50 60)">
      ✓ Oranges
    </text>
  </g>
</svg>