  <line x1="240" y1="80" x2="240" y2="360" stroke="#FFFF00" stroke-width="4" stroke-dasharray="10,5"/>
  <line x1="340" y1="80" x2="340" y2="360" stroke="#FFFF00" stroke-width="4" stroke-dasharray="10,5"/>
  <line x1="440" y1="80" x2="440" y2="360" stroke="#FFFF00" stroke-width="4" stroke-dasharray="10,5"/>
  
  <!-- Red cars (3) -->
  <g id="red-cars">
