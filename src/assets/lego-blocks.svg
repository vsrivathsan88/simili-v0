<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="200" fill="#FFFEF7"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="20" fill="#2D3748">
    What fraction of the blocks are blue?
  </text>
  
  <!-- LEGO Blocks Container -->
  <g transform="translate(100, 60)">
    <!-- Blue blocks (2) -->
    <g id="blue-blocks">
      <!-- Block 1 -->
      <rect x="0" y="0" width="60" height="80" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="2"/>
      <circle cx="15" cy="20" r="5" fill="#2563EB"/>
      <circle cx="45" cy="20" r="5" fill="#2563EB"/>
      <circle cx="15" cy="40" r="5" fill="#2563EB"/>
      <circle cx="45" cy="40" r="5" fill="#2563EB"/>
      <circle cx="15" cy="60" r="5" fill="#2563EB"/>
      <circle cx="45" cy="60" r="5" fill="#2563EB"/>
      
      <!-- Block 2 -->
      <rect x="70" y="0" width="60" height="80" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="2"/>
      <circle cx="85" cy="20" r="5" fill="#2563EB"/>
      <circle cx="115" cy="20" r="5" fill="#2563EB"/>
      <circle cx="85" cy="40" r="5" fill="#2563EB"/>
      <circle cx="115" cy="40" r="5" fill="#2563EB"/>
      <circle cx="85" cy="60" r="5" fill="#2563EB"/>
      <circle cx="115" cy="60" r="5" fill="#2563EB"/>
    </g>
    
    <!-- Gray blocks (4) -->
    <g id="gray-blocks">
      <!-- Block 3 -->
      <rect x="140" y="0" width="60" height="80" fill="#9CA3AF" stroke="#6B7280" stroke-width="2" rx="2"/>
      <circle cx="155" cy="20" r="5" fill="#6B7280"/>
      <circle cx="185" cy="20" r="5" fill="#6B7280"/>
      <circle cx="155" cy="40" r="5" fill="#6B7280"/>
      <circle cx="185" cy="40" r="5" fill="#6B7280"/>
      <circle cx="155" cy="60" r="5" fill="#6B7280"/>
      <circle cx="185" cy="60" r="5" fill="#6B7280"/>
      
      <!-- Block 4 -->
      <rect x="210" y="0" width="60" height="80" fill="#9CA3AF" stroke="#6B7280" stroke-width="2" rx="2"/>
      <circle cx="225" cy="20" r="5" fill="#6B7280"/>
      <circle cx="255" cy="20" r="5" fill="#6B7280"/>
      <circle cx="225" cy="40" r="5" fill="#6B7280"/>
      <circle cx="255" cy="40" r="5" fill="#6B7280"/>
      <circle cx="225" cy="60" r="5" fill="#6B7280"/>
      <circle cx="255" cy="60" r="5" fill="#6B7280"/>
      
      <!-- Block 5 -->
      <rect x="280" y="0" width="60" height="80" fill="#9CA3AF" stroke="#6B7280" stroke-width="2" rx="2"/>
      <circle cx="295" cy="20" r="5" fill="#6B7280"/>
      <circle cx="325" cy="20" r="5" fill="#6B7280"/>
      <circle cx="295" cy="40" r="5" fill="#6B7280"/>
      <circle cx="325" cy="40" r="5" fill="#6B7280"/>
      <circle cx="295" cy="60" r="5" fill="#6B7280"/>
      <circle cx="325" cy="60" r="5" fill="#6B7280"/>
      
      <!-- Block 6 -->
      <rect x="350" y="0" width="60" height="80" fill="#9CA3AF" stroke="#6B7280" stroke-width="2" rx="2"/>
      <circle cx="365" cy="20" r="5" fill="#6B7280"/>
      <circle cx="395" cy="20" r="5" fill="#6B7280"/>
      <circle cx="365" cy="40" r="5" fill="#6B7280"/>
      <circle cx="395" cy="40" r="5" fill="#6B7280"/>
      <circle cx="365" cy="60" r="5" fill="#6B7280"/>
      <circle cx="395" cy="60" r="5" fill="#6B7280"/>
    </g>
  </g>
</svg>