      <rect x="5" y="15" width="60" height="20" fill="#FF0000" stroke="#8B0000" stroke-width="2" rx="5"/>
      <rect x="20" y="10" width="30" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
