      <rect x="20" y="10" width="30" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="1"/>
      <circle cx="15" cy="50" r="8" fill="#000000"/>
      <circle cx="55" cy="50" r="8" fill="#000000"/>
      <circle cx="15" cy="50" r="4" fill="#C0C0C0"/>
      <circle cx="55" cy="50" r="4" fill="#C0C0C0"/>
      <text x="35" y="30" text-anchor="middle" font-family="Arial" font-size="10" fill="#FFFFFF">1</text>
    </g>
    
    <!-- Car 2 -->
