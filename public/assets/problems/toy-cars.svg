    <rect x="15" y="25" width="10" height="10" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <ellipse cx="20" cy="35" rx="15" ry="3" fill="#8B4513"/>
    <text x="20" y="20" text-anchor="middle" font-family="Arial" font-size="8" fill="#8B4513">1st</text>
  </g>
  
  <!-- Checkered flag -->
  <g transform="translate(480, 80)">
    <rect x="0" y="0" width="40" height="30" fill="#000000"/>
    <rect x="0" y="0" width="10" height="10" fill="#FFFFFF"/>
    <rect x="20" y="0" width="10" height="10" fill="#FFFFFF"/>
    <rect x="10" y="10" width="10" height="10" fill="#FFFFFF"/>
    <rect x="30" y="10" width="10" height="10" fill="#FFFFFF"/>
    <rect x="0" y="20" width="10" height="10" fill="#FFFFFF"/>
